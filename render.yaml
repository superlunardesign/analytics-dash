version: "1"
services:
- type: web
  name: analytics-dash-frontend
  runtime: static
  repo: https://github.com/superlunardesign/analytics-dash
  branch: claude/creator-page-builder
  envVars:
  - key: VIDEO_ANALYZER_AUTH_TOKEN
    sync: false
  - key: VIDEO_ANALYZER_DATABASE_URL
    sync: false
  - key: VIDEO_ANALYZER_APP_URL
    sync: false
  - key: VITE_API_BASE_URL
    sync: false
  buildCommand: npm install && npm run build
  staticPublishPath: dist
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  autoDeployTrigger: commit
  rootDir: frontend
