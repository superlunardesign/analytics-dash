databases:
  - name: analytics-dash-db
    databaseName: analytics_dash
    user: analytics_dash
    plan: free

services:
  - type: web
    name: analytics-dash-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free-tier services don't support preDeployCommand, so the migration
    # runs at the front of the start command instead. `alembic upgrade
    # head` is a no-op once the schema's already current, so this is safe
    # to run on every restart.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analytics-dash-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: META_GRAPH_API_VERSION
        value: v22.0
      # Fill these in on the Render dashboard after creation (Environment
      # tab) -- see README.md for where each value comes from. The same
      # three values need to be set again on analytics-dash-sync below,
      # since Render doesn't let a blueprint-defined env var group hold
      # values you fill in later.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      # Set these after the API and frontend are deployed once, so you
      # have their real *.onrender.com URLs to fill in.
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

  - type: cron
    name: analytics-dash-sync
    runtime: python
    rootDir: backend
    plan: starter # Render has no free tier for cron jobs; this is the cheapest paid tier.
    schedule: "0 */4 * * *" # every 4 hours -- adjust to taste, mind the ~200 calls/hour Graph API limit
    buildCommand: pip install -r requirements.txt
    startCommand: python sync_cron.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analytics-dash-db
          property: connectionString
      - key: META_GRAPH_API_VERSION
        value: v22.0
      # Must match the values set on analytics-dash-api exactly -- both
      # services encrypt/decrypt the same stored OAuth tokens.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false

  - type: web
    name: analytics-dash-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the analytics-dash-api service's live URL after first deploy.
      - key: VITE_API_BASE_URL
        sync: false
